#AFK
#
#自動キックはこのプラグインに入っていない（v1.5 で確認・下の max-player〜min-kick-time は使われていない古い設定）
#the function to kick automatically
#max-player: how many players
#type: tps or mspt
#max-tps:
#min-mspt:

checking-interval: 30
#seconds
set-afk-interval: 5
#minutes
look-threshold: 5.0
#degrees: 視点の向き(yaw+pitch)の変化の合計がこれ以上で「操作した」と数える（checking-interval ごとに合計を空にする）
#クリック・攻撃は数えない（v1.4〜）・チャットとコマンド（/afk 以外）は数える（v1.5〜）
#v1.6〜: 位置の変化（水流・ピストン・乗り物で運ばれる）は数えない。移動キー（前後左右・ジャンプ・スニーク・ダッシュ）の押し替えは数える
afk-cancel-actions: true
#離席中は使う・置く・壊す・攻撃するを黙って空振りにする（メッセージ・音・ログなし）。false で切る

max-player: 15
type: "mspt"
max-tps: 17.0
min-mspt: 60
min-kick-time: 20
#minutes

#the function to set the prefix
set-time: